name: Build M Grow APK

on:
  workflow_dispatch:
  push:
    paths:
      - "m_grow/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  # Deploys the online AI coach (free Cloudflare Workers AI).
  # Skipped automatically until you add the two Cloudflare secrets.
  coach:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    outputs:
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v5
        if: env.CF_TOKEN != ''

      - name: Deploy AI coach
        id: deploy
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: m_grow/backend

      - name: Say what happened
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "No CLOUDFLARE_API_TOKEN secret yet: the AI coach is not deployed. The app uses built-in quick tips."
          else
            echo "AI coach address: ${{ steps.deploy.outputs.deployment-url }}"
          fi

  build:
    needs: coach
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: m_grow
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android files
        run: |
          flutter create --platforms=android --org com.mgrow --project-name m_grow .
          rm -rf test

      - name: Add permissions and app name
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          add = (
              '<uses-permission android:name="android.permission.INTERNET"/>\n'
              '    <uses-permission android:name="android.permission.ACTIVITY_RECOGNITION"/>\n'
              '    <queries><intent><action android:name="android.intent.action.SENDTO"/>'
              '<data android:scheme="mailto"/></intent></queries>\n    '
          )
          s = s.replace('<application', add + '<application', 1)
          s = s.replace('android:label="m_grow"', 'android:label="M Grow"')
          open(p, 'w').write(s)
          PY

      - name: Get packages
        run: flutter pub get

      - name: Check code (lists problems)
        continue-on-error: true
        run: flutter analyze

      - name: Build APK
        run: >
          flutter build apk --release
          --dart-define=AI_ENDPOINT=${{ needs.coach.outputs.url }}
          --dart-define=FEEDBACK_EMAIL=${{ vars.FEEDBACK_EMAIL }}

      - uses: actions/upload-artifact@v4
        with:
          name: m-grow-apk
          path: m_grow/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK to Releases (easy phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk M-Grow.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest M-Grow.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "M Grow - latest test build" \
            --notes "Test build for Android. Download M-Grow.apk, open it, and allow installs from this source when Android asks."
